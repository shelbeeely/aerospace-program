<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#02050d" />
    <title>Digital World Explorer</title>
    <link rel="stylesheet" href="/src/style.css" />
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #02050d; }
      #view { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; }
      #ex-bar { position: fixed; left: 12px; top: 12px; z-index: 30; display: flex; flex-wrap: wrap; gap: 6px; max-width: calc(100vw - 400px);
        font: 12px ui-monospace, Menlo, Consolas, monospace; color: #cfe6ff; }
      #ex-bar button, #ex-bar select { background: rgba(3, 10, 30, 0.88); color: #cfe6ff; border: 1px solid rgba(54, 226, 255, 0.35); padding: 5px 9px; font: inherit; cursor: pointer; }
      #ex-bar button.on { background: #36e2ff; color: #02050d; }
      #ex-info { position: fixed; left: 12px; bottom: 12px; z-index: 30; font: 11px ui-monospace, Menlo, monospace; color: #8fb6e8; background: rgba(3, 10, 30, 0.7); padding: 6px 9px; border: 1px solid rgba(54, 226, 255, 0.2); max-width: 520px; }
      #ex-loading { position: fixed; inset: 0; display: grid; place-items: center; color: #36e2ff; font: 14px ui-monospace, monospace; letter-spacing: 0.2em; z-index: 50; background: #02050d; }
      .ex-stick { position: fixed; bottom: 24px; width: 120px; height: 120px; border: 1px solid rgba(54, 226, 255, 0.35); border-radius: 50%; z-index: 25; display: none; }
      @media (pointer: coarse) { .ex-stick { display: block; } #ex-bar { max-width: calc(100vw - 24px); } }
      @media (max-width: 700px) { #ex-info { display: none; } }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="ex-loading">GENERATING THE DIGITAL WORLD…</div>
    <div id="ex-bar">
      <button id="ex-mode" title="Fly or walk (F)">Fly</button>
      <select id="ex-go" title="Travel to an example district, region, terrain archetype or landmark"><option value="">Travel to…</option></select>
      <button id="ex-lab" title="Archetype lab">Lab</button>
      <button id="ex-panel" title="Debug panel (K)">Panel</button>
    </div>
    <div id="ex-info">WASD move · drag to look · Q/E down/up · Shift fast · wheel speed · F fly/walk · K panel</div>
    <div class="ex-stick" id="ex-stick-l" style="left: 24px"></div>
    <div class="ex-stick" id="ex-stick-r" style="right: 24px"></div>
    <script type="module" src="/src/explore/main.ts"></script>
  </body>
</html>
