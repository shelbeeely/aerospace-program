# Render Blueprint for the Grid multiplayer relay (https://render.com/docs/blueprint-spec).
# Deploy: Render dashboard → New → Blueprint → pick this repository. Render builds
# server/Dockerfile, sets PORT, serves it over TLS at wss://<name>.onrender.com, and redeploys
# when the relay or the shared protocol changes on main.
services:
  - type: web
    name: grid-relay
    runtime: docker
    dockerfilePath: ./server/Dockerfile
    dockerContext: .
    # Free instances sleep after 15 minutes without traffic (the first player waits ~1 minute
    # while it wakes; sleeping drops open rooms and the Bits' world, which players' saved pools
    # then reseed). Use "starter" for an always-on relay whose world never stops.
    plan: free
    region: oregon
    branch: main
    autoDeploy: true
    healthCheckPath: /health
    buildFilter:
      paths:
        - server/**
        - src/net/protocol.ts
        - src/sim/evolution.ts
        - src/people/genome.ts
        - src/people/bitStyle.ts
    envVars:
      - key: NODE_ENV
        value: production
