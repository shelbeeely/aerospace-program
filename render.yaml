# Render Blueprint for the Grid multiplayer relay (https://render.com/docs/blueprint-spec).
# Deploy: Render dashboard → New → Blueprint → pick this repository. Render builds
# server/Dockerfile, sets PORT, serves it over TLS at wss://<name>.onrender.com, and redeploys
# when the relay or the shared protocol changes on main.
services:
  - type: web
    name: grid-relay
    runtime: docker
    dockerfilePath: ./server/Dockerfile
    dockerContext: .
    # Always on, with a disk: the living world (AGENTS.md §21) goes on with nobody connected and
    # is saved to /var/data, so a restart or redeploy picks up where it left off. (A free
    # instance sleeps after 15 idle minutes and forgets; disks need a paid plan.)
    plan: starter
    disk:
      name: grid-data
      mountPath: /var/data
      sizeGB: 1
    region: oregon
    branch: main
    autoDeploy: true
    healthCheckPath: /health
    buildFilter:
      paths:
        - server/**
        - src/net/protocol.ts
        - src/sim/evolution.ts
        - src/people/genome.ts
        - src/people/bitStyle.ts
        - src/living/**
    envVars:
      - key: NODE_ENV
        value: production
      - key: LIVING_DATA
        value: /var/data/living
